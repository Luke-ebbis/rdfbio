[package]
name = "rdf-bio"
version = "0.1.0"
edition = "2021"

[lib]
name = "rdfbio"
path = "src/lib.rs"


[[bin]]
name = "rdfbio"
path = "src/main.rs"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3


[dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1.44.1", features = ["full"] }
clap = { version = "4.5.27", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
derive_builder = "0.20.2"
linked-data = "0.1.2"
rdf-types = "0.22.4"
iref = "3.2.2"
log = "0.4.25"
env_logger = "0.11.6"
regex = "1.11.1"
quick-xml = "0.37.2"
thiserror = "2.0.11"
rayon = "1.10.0"
test-log = "0.2.17"
futures = "0.3.31"
url = "2.5.4"
csv = "1.3.1"
serde_with = "3.12.0"
