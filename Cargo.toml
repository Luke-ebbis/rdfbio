[package]
name = "rdf-bio"
version = "0.1.0"
edition = "2021"

[lib]
name = "rdfbio"
path = "src/lib.rs"


[[bin]]
name = "rdfbio"
path = "src/main.rs"


[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4.4.11", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
